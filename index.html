<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>■</title>
  <link rel="stylesheet" href="skvto.css">
  <script src="//cdn.jsdelivr.net/npm/medium-editor@latest/dist/js/medium-editor.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/medium-editor@latest/dist/css/medium-editor.min.css"
        type="text/css" media="screen">
  <link rel="manifest" href="vourer/skvto.json">
</head>
<body>
<div id="all">
  <button
    type="button"
    role="switch"
    aria-checked="false"
    id="bells-and-whistles"
    class="switch">
    <span>off</span>
    <span>on</span>
  </button>
  <label for="bells-and-whistles" class="switch">Bells & Whistles</label>

  <div id="reader"></div>
  <nav aria-label="pagination">
    <a id="nav-back" href="#back"><span aria-hidden="true">«</span>Turn Back</a>
    <a id="nav-next" href="#next">Turn the Page<span aria-hidden="true">»</span></a>
  </nav>
  <nav id="edit" aria-label="edit">
    <a id="edit-reader" href="#edit"><span>Edit</span><span aria-hidden="true">»</span></a>
    <a id="edit-clear" href="#edit-clear"><span>Clear</span><span aria-hidden="true">x</span></a>
    <a id="edit-save" href="#edit-save"><span>Save</span><span aria-hidden="true">s</span></a>
  </nav>
</div>
<script src="js/skvto.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js", { scope: "/" }).then(
      (registration) => {
        console.log("Service worker registration successful:", registration);
      },
      (error) => {
        console.error(`Service worker registration failed: ${error}`);
      },
    );
  } else {
    console.error("Service workers are not supported.");
  }
</script>
</body>
</html>
